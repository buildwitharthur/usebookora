# Apenas para testes/desenvolvimento local.
services:
  postgres:
    image: postgres:18-alpine
    container_name: bookora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookora
      POSTGRES_PASSWORD: bookora
      POSTGRES_DB: bookora
    ports:
      - "5432:5432"
    volumes:
      - bookora_pgdata:/var/lib/postgresql

volumes:
  bookora_pgdata:
